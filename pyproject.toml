[project]
name = "lineagelens"
version = "0.1.0"
description = "Column-level SQL lineage, impact analysis, viewer, and agent"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "networkx>=3",
    "pydantic>=2",
    "rich>=13",
    "sqlglot>=26",
    "typer>=0.16",
]

[project.scripts]
lineagelens = "lineagelens.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pytest>=8",
    "pyyaml>=6",
    "ruff==0.16.9",
    "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lineagelens"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["lineagelens"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["lineagelens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]
